# Bee self-host stack. Only the proxy is exposed publicly (port 7070).
#   /api/*    -> api    (Fastify, :8421)
#   /collab*  -> collab (Hocuspocus WebSocket, :1234)
#   /*        -> web    (:8423)
# Local dev: `docker compose up -d postgres` and run apps with `pnpm dev`.
name: bee

services:
  postgres:
    image: postgres:17-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-bee}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-bee}
      POSTGRES_DB: ${POSTGRES_DB:-bee}
    ports:
      - '127.0.0.1:54329:5432'
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U ${POSTGRES_USER:-bee} -d ${POSTGRES_DB:-bee}']
      interval: 5s
      timeout: 5s
      retries: 20

  api:
    build: { context: ., dockerfile: apps/api/Dockerfile }
    restart: unless-stopped
    depends_on:
      postgres: { condition: service_healthy }
    environment:
      NODE_ENV: production
      PORT: 8421
      DATABASE_URL: postgres://${POSTGRES_USER:-bee}:${POSTGRES_PASSWORD:-bee}@postgres:5432/${POSTGRES_DB:-bee}
      SESSION_SECRET: ${SESSION_SECRET:?set SESSION_SECRET}
      COLLAB_SECRET: ${COLLAB_SECRET:?set COLLAB_SECRET}
      BEE_PUBLIC_URL: ${BEE_PUBLIC_URL:-http://localhost:7070}
      UPLOAD_DIR: /data/uploads
      COLLAB_INTERNAL_URL: http://collab:1234
      ALLOWED_ORIGINS: ${ALLOWED_ORIGINS:-http://localhost:7070}
    volumes:
      - uploads:/data/uploads
    healthcheck:
      test: ['CMD', 'node', '-e', "fetch('http://127.0.0.1:8421/api/health').then(r=>process.exit(r.ok?0:1),()=>process.exit(1))"]
      interval: 10s
      timeout: 5s
      retries: 10

  collab:
    build: { context: ., dockerfile: apps/collab/Dockerfile }
    restart: unless-stopped
    depends_on:
      api: { condition: service_healthy }
    environment:
      NODE_ENV: production
      PORT: 1234
      API_INTERNAL_URL: http://api:8421
      COLLAB_SECRET: ${COLLAB_SECRET:?set COLLAB_SECRET}
      REDIS_URL: ${REDIS_URL:-}

  web:
    build: { context: ., dockerfile: apps/web/Dockerfile }
    restart: unless-stopped
    environment:
      NODE_ENV: production
      PORT: 8423
      API_INTERNAL_URL: http://api:8421
      BEE_PUBLIC_URL: ${BEE_PUBLIC_URL:-http://localhost:7070}

  proxy:
    image: caddy:2-alpine
    restart: unless-stopped
    depends_on: [api, collab, web]
    ports:
      - '${BEE_PORT:-7070}:7070'
    # Inline config instead of a bind mount: the Docker VM on macOS cannot read
    # files under ~/Documents, and the deploy swaps the checkout directory.
    configs:
      - source: caddyfile
        target: /etc/caddy/Caddyfile

configs:
  caddyfile:
    content: |
      {
      	auto_https off
      	admin off
      }

      :7070 {
      	encode zstd gzip
      	request_body {
      		max_size 50MB
      	}

      	handle /api/* {
      		reverse_proxy api:8421
      	}
      	handle /collab* {
      		reverse_proxy collab:1234
      	}
      	handle {
      		reverse_proxy web:8423
      	}
      }

volumes:
  pgdata:
  uploads:
